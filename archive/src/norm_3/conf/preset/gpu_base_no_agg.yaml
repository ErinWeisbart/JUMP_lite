# @package _global_

# Base preset for norm_3 GPU sweeps WITHOUT aggregation
# For data that is already at well-level

input:
  path: null  # Override via command line

output:
  path: "data/features/gpu_sweep_no_agg/output.parquet"
  compression: zstd

# Validation settings
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70
skip_redundant_configs: true

steps:
  - name: clean_nans
    enabled: true
    params:
      na_cutoff: 0.30

  - name: aggregate_wells
    enabled: false  # DISABLED - data already at well level
    params:
      strata:
        - Metadata_Plate
        - Metadata_Well
      method: median

  - name: filter_features
    enabled: false
    params:
      filters:
        - name: variance_threshold
          freq_cut: 0.05
          unique_cut: 0.01
        - name: drop_outliers
          outlier_cutoff: 50
        - name: drop_na_columns
          threshold: 0.05

  - name: merge_metadata
    enabled: true
    params:
      metadata_path: /home/jfredinh/projects/JUMP_core/metadata/jump_target2_4plate_full_metadata.parquet
      skip_merge: false

  - name: normalize_robustmad
    enabled: true
    params:
      batch_col: Metadata_Plate
      fit_on_controls: true
      epsilon: 1.0e-18

  - name: normalize_standardize
    enabled: false
    params:
      batch_col: Metadata_Plate
      fit_on_controls: true

  - name: sample_norm
    enabled: false
    params:
      norm: l2

  - name: well_position_correct
    enabled: false
    params:
      well_col: Metadata_Well

  - name: inverse_normal_transform
    enabled: false
    params: {}

  - name: normalize_pca
    enabled: false
    params:
      n_components: 128
      whiten: false
      fit_on_controls: false

  - name: normalize_tvn
    enabled: false
    params:
      batch_col: Metadata_Plate
      alpha: 0.5
      epsilon: 1.0
      fit_on_controls: true

  - name: normalize_tvn_efaar
    enabled: false
    params:
      batch_col: Metadata_Plate
      epsilon: 0.5

  - name: normalize_spherize
    enabled: false
    params:
      method: "ZCA-cor"
      batch_col: ""
      fit_on_controls: false
      epsilon: 1.0e-6

  - name: prune_correlated
    enabled: false
    params:
      threshold: 0.90

  - name: evaluate_metrics
    enabled: true
    params:
      skip_visualization: true
      min_compounds_per_target: 3
      compound_col: Metadata_broad_sample
      target_col: Metadata_target_list
      negcon_col: Metadata_negcon
      negcon_value: DMSO
      batch_col: Metadata_Plate
