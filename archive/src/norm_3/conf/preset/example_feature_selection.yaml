# @package _global_

# Example configuration showing how to use include/exclude feature filtering

input:
  path: null  # Override via command line

output:
  path: "data/features/filtered_output.parquet"
  compression: zstd

# Validation settings
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70
skip_redundant_configs: true

steps:
  - name: clean_nans
    enabled: true
    params:
      na_cutoff: 0.30

  - name: filter_features
    enabled: true
    params:
      filters:
        # === CSV-based filtering (precise feature selection) ===

        # Option A: Include only specific features from CSV
        # Uncomment to use:
        # - name: include_from_csv
        #   csv_path: /path/to/features_to_keep.csv
        #   column: feature  # Column name containing feature names

        # Option B: Exclude specific features from CSV
        # Uncomment to use:
        # - name: exclude_from_csv
        #   csv_path: /path/to/features_to_remove.csv
        #   column: feature

        # === Pattern-based filtering (flexible) ===

        # Example 1: Include only specific feature types
        # This keeps only Intensity and Texture features
        - name: include_features
          patterns:
            - Intensity
            - Texture

        # Example 2: Exclude unwanted features
        # This removes Location and ObjectNumber features
        - name: exclude_features
          patterns:
            - Location
            - ObjectNumber

        # Example 3: Use blocklist for default exclusions
        - name: blocklist
          # Uses default blocklist if not specified

        # === Quality-based filtering ===

        # Example 4: Drop outliers
        - name: drop_outliers
          outlier_cutoff: 50

        # Example 5: Drop low-variance features
        - name: variance_threshold
          freq_cut: 0.05
          unique_cut: 0.01

  - name: merge_metadata
    enabled: true
    params:
      metadata_path: /home/jfredinh/projects/JUMP_core/metadata/jump_target2_4plate_full_metadata.parquet
      skip_merge: false

  - name: normalize_robustmad
    enabled: true
    params:
      batch_col: Metadata_Plate
      fit_on_controls: true
      epsilon: 1.0e-18

  - name: prune_correlated
    enabled: true
    params:
      threshold: 0.90

  - name: aggregate_wells
    enabled: true
    params:
      strata:
        - Metadata_Plate
        - Metadata_Well
      method: median

  - name: evaluate_metrics
    enabled: true
    params:
      skip_visualization: true
      min_compounds_per_target: 3
      compound_col: Metadata_broad_sample
      target_col: Metadata_target_list
      negcon_col: Metadata_negcon
      negcon_value: DMSO
      batch_col: Metadata_Plate
