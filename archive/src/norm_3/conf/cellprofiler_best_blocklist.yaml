# @package _global_

# CellProfiler Best Setting with Blocklist
# robustmad_ctrl__INT__prune0.85__agg_mean + blocklist filter
# Tests impact of removing position-related features

defaults:
  - /preset/gpu_base

input:
  path: /home/jfredinh/projects/JUMP_core/output/cellprofiler_raw_jump_core_annotated_raw_features.parquet

output:
  path: "data/features/unified_batch_sweep/output.parquet"
  compression: zstd

# Skip redundant checks
skip_redundant_configs: false
skip_existing: false
abort_on_invalid_features: false
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === SWEEP PARAMS (manual override) ===
batch_method: none
norm_method: robustmad
norm_fit_controls: true

use_wellcorr: false
use_int: true
use_sample_norm: false
use_spherize: false
use_pca: false
use_filter_features: true
use_prune_correlated: true
corr_thresh: 0.85
agg_method: mean

# === STEPS ===
steps:
  - name: clean_nans
    enabled: true
    params:
      na_cutoff: 0.3

  # NOTE: The sweep used `filters` key but pipeline reads `operations` key.
  # So sweep actually used DEFAULT operations (variance_threshold + drop_outliers@500).
  # For exact match + blocklist, we explicitly specify those defaults + blocklist.
  - name: filter_features
    enabled: true
    params:
      operations:
        - name: variance_threshold
          freq_cut: 0.05
          unique_cut: 0.01
        - name: drop_outliers
          outlier_cutoff: 500
        # BLOCKLIST - filter position-related features (NEW)
        - name: blocklist
          blocklist:
            - "Location_Center"
            - "Location_Max"
            - "Location_Min"
            - "Number_Object_Number"
            - "ExecutionTime"
            - "BoundingBox"
            - "ObjectNumber"

  - name: merge_metadata
    enabled: true
    params:
      metadata_path:
        - /home/jfredinh/projects/JUMP_core/metadata/metadata_dataset_filtered_4reps.parquet
        - /home/jfredinh/projects/JUMP_core/metadata/dataset_overlaps/refchemdb_targets_by_jcp.parquet
      skip_merge: false

  - name: normalize_robustmad
    enabled: true
    params:
      fit_on_controls: true
      batch_col: Metadata_Plate
      epsilon: 1e-18

  - name: normalize_standardize
    enabled: false

  - name: sample_norm
    enabled: false

  - name: well_position_correct
    enabled: false

  - name: inverse_normal_transform
    enabled: true
    params: {}

  - name: normalize_pca
    enabled: false

  - name: normalize_tvn
    enabled: false

  - name: normalize_tvn_efaar
    enabled: false

  - name: normalize_spherize
    enabled: false

  - name: prune_correlated
    enabled: true
    params:
      threshold: 0.85

  - name: aggregate_wells
    enabled: true
    params:
      strata:
        - Metadata_Plate
        - Metadata_Well
      method: mean

  - name: evaluate_metrics
    enabled: true
    params:
      skip_visualization: true
      compound_col: Metadata_JCP2022
      target_col: Metadata_WithinModalityTier_Tier3_Target
      negcon_col: Metadata_negcon
      negcon_value: DMSO
      batch_col: Metadata_Plate
      min_compounds_per_target: 2

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
