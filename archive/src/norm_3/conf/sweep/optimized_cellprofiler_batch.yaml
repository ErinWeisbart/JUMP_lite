# @package _global_

# Optimized CellProfiler Sweep using Metadata_Batch for TVN EFAAR
# (Same as optimized_cellprofiler but with batch_col=Metadata_Batch for comparison)

defaults:
  - /preset/gpu_base

# Override output to separate folder
output:
  path: "data/features/optimized_cellprofiler_batch_sweep/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES ===
batch_method: tvn_efaar
norm_method: robustmad
norm_fit_controls: false

use_wellcorr: true
use_int: true
use_sample_norm: false
sample_norm_type: l2

use_spherize: true
spherize_fit_controls: true
spherize_method: "PCA-cor"

use_pca: false
pca_n_components: 64

use_filter_features: true
use_prune_correlated: true
corr_thresh: 0.85

agg_method: mean

tvn_efaar_epsilon: 0.5

# === FIXED PARAMETERS ===
skip_visualization: true

# === OVERRIDE TVN EFAAR TO USE Metadata_Batch ===
steps:
  - name: clean_nans
    enabled: true
    params:
      na_cutoff: 0.3

  - name: filter_features
    enabled: true
    params:
      filters:
        - name: variance_threshold
          freq_cut: 0.05
          unique_cut: 0.01
        - name: drop_na_columns
          threshold: 0.05

  - name: merge_metadata
    enabled: true
    params:
      metadata_path:
        - /home/jfredinh/projects/JUMP_core/metadata/metadata_dataset_filtered_4reps.parquet
        - /home/jfredinh/projects/JUMP_core/metadata/dataset_overlaps/refchemdb_targets_by_jcp.parquet
      skip_merge: false

  - name: normalize_robustmad
    enabled: false
    params:
      fit_on_controls: true
      batch_col: Metadata_Plate
      epsilon: 1e-18

  - name: normalize_standardize
    enabled: false
    params:
      fit_on_controls: true
      batch_col: Metadata_Plate

  - name: sample_norm
    enabled: false
    params:
      norm: l2

  - name: well_position_correct
    enabled: true
    params:
      well_col: Metadata_Well

  - name: inverse_normal_transform
    enabled: true
    params: {}

  - name: normalize_pca
    enabled: false
    params:
      n_components: 64
      fit_on_controls: false
      whiten: false

  - name: normalize_tvn
    enabled: false
    params:
      alpha: 0.5
      batch_col: Metadata_Plate
      epsilon: 1.0
      fit_on_controls: true

  - name: normalize_tvn_efaar
    enabled: true
    params:
      batch_col: Metadata_Batch  # USE BATCH INSTEAD OF PLATE
      epsilon: 0.5

  - name: normalize_spherize
    enabled: true
    params:
      method: "PCA-cor"
      batch_col: ""
      epsilon: 1e-6
      fit_on_controls: true

  - name: prune_correlated
    enabled: true
    params:
      threshold: 0.85

  - name: aggregate_wells
    enabled: true
    params:
      strata:
        - Metadata_Plate
        - Metadata_Well
      method: mean

  - name: evaluate_metrics
    enabled: true
    params:
      skip_visualization: true
      compound_col: Metadata_JCP2022
      target_col: Metadata_WithinModalityTier_Tier3_Target
      negcon_col: Metadata_negcon
      negcon_value: DMSO
      batch_col: Metadata_Plate
      min_compounds_per_target: 2

# === HYDRA SWEEP ===
# Only tvn_efaar configs
# 2 x 2 x 3 = 12 configs
hydra:
  sweeper:
    params:
      # Spherize method: PCA-cor vs ZCA-cor
      spherize_method: PCA-cor,ZCA-cor

      # Spherize fit on controls: true (better PC) vs false
      spherize_fit_controls: true,false

      # Prune threshold: 0.85 (best) vs 0.90 vs 0.95
      corr_thresh: 0.85,0.90,0.95

  launcher:
    n_jobs: 4
    prefer: processes
    verbose: 1
