# @package _global_

# Simple CellProfiler Sweep with AGGREGATION FIRST - Extended Outlier Thresholds
# Pipeline order: Aggregate → Normalize → Filter → Evaluate
#
# Testing:
# - Normalization method (RobustMAD vs Standardize)
# - Batch correction (None vs TVN EFAAR)
# - Inverse Normal Transform (on vs off)
# - Feature selection (on vs off)
# - Extended outlier cutoff range (12 thresholds: 2,5,10,15,20,25,30,40,50,75,100,250)
# - Correlation pruning threshold
#
# Total configs: 2 x 2 x 2 x (1 + 12) x 3 = 312 configs
# With redundancy logic: ~234 configs per compression
# - 2 norm methods (but tvn_efaar ignores this, so effectively fewer)
# - 2 batch methods (none, tvn_efaar)
# - 2 INT options (true, false)
# - 13 feature filtering combos (off + 12 outlier cutoffs)
# - 3 correlation thresholds

defaults:
  - /preset/gpu_base_no_agg

# Override output to separate folder
output:
  path: "data/features/simple_cellprofiler_agg_first_extended_outliers_sweep/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true  # Skip already completed configs
abort_on_invalid_features: false  # Allow PC1 variance check to pass (agg before norm)
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.99

# === DEFAULT VALUES ===
batch_method: none  # No batch correction
norm_method: robustmad

use_wellcorr: false
use_int: true
use_sample_norm: false
use_spherize: false  # No spherize
use_pca: false

use_filter_features: true
use_prune_correlated: true
corr_thresh: 0.90
outlier_cutoff: 50

agg_method: median

# === FIXED PARAMETERS ===
skip_visualization: true

# === HYDRA SWEEP ===
# 2 x 2 x 2 x 13 x 3 = 312 configs (reduced by redundancy logic)
hydra:
  sweeper:
    params:
      # Normalization method: RobustMAD vs Standardize
      norm_method: robustmad,standardize

      # Batch correction method: None vs TVN EFAAR
      batch_method: none,tvn_efaar

      # Inverse Normal Transform (INT)
      use_int: true,false

      # Feature selection with extended outlier filtering
      # When use_filter_features=false, outlier_cutoff is ignored
      use_filter_features: true,false
      outlier_cutoff: 2,5,10,15,20,25,30,40,50,75,100,250

      # Correlation pruning threshold
      corr_thresh: 0.85,0.90,0.95

  launcher:
    n_jobs: 32
    prefer: processes
    verbose: 1
