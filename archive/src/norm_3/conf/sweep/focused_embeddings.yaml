# @package _global_

# Focused GPU Embeddings Sweep for norm_3
#
# Based on analysis of previous results:
# - tvn_efaar is best batch correction
# - pca128 outperforms pca64
# - agg_mean slightly better than median
# - Spherize (ZCA-cor) can help
#
# ~20 unique configs per model
#
# === USAGE ===
#   cd src/norm_3
#   pixi run python -m norm_3.pipeline --multirun \
#     +sweep=focused_embeddings \
#     input.path=/path/to/embeddings.parquet

defaults:
  - /preset/gpu_base

# Override output to separate folder
output:
  path: "data/features/focused_sweep/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES ===
batch_method: none
norm_method: robustmad
norm_fit_controls: true

use_spherize: false
spherize_fit_controls: true
spherize_method: "ZCA-cor"

use_pca: true
pca_n_components: 128

use_prune_correlated: false
corr_thresh: 0.90

agg_method: median

tvn_efaar_epsilon: 0.5

# === FIXED PARAMETERS ===
use_filter_features: false
skip_visualization: true

# === HYDRA SWEEP ===
# 2 x 2 x 2 x 2 = 16 configs per model
hydra:
  sweeper:
    params:
      # Batch correction: none vs tvn_efaar (best performer)
      batch_method: none,tvn_efaar

      # PCA: 128 (best performer)
      pca_n_components: 128

      # Spherize: off vs ZCA-cor
      use_spherize: false,true

      # Prune correlated features
      use_prune_correlated: false,true

      # Aggregation: median vs mean (mean often better)
      agg_method: median,mean

  launcher:
    n_jobs: 4
    prefer: processes
    verbose: 1
