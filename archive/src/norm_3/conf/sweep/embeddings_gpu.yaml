# @package _global_

# GPU Embeddings Sweep for norm_3 (Expanded)
#
# Comprehensive GPU-accelerated normalization sweep for deep learning embeddings.
# GPU parallelizes internally, so sweeps run with limited parallelism.
#
# === PARAMETER SPACE ===
#   batch_method: 2 (none, tvn_efaar)
#   norm_method: 2 (robustmad, standardize)
#   norm_fit_controls: 2 (true, false)
#   use_pca: 2 (false, true)
#   pca_n_components: 3 (64, 128, 256)
#   use_spherize: 2 (false, true)
#   spherize_method: 2 (ZCA-cor, PCA-cor)
#   spherize_fit_controls: 2 (true, false)
#   use_prune_correlated: 2 (false, true)
#   corr_thresh: 2 (0.90, 0.95)
#   agg_method: 2 (median, mean)
#   tvn_efaar_epsilon: 2 (0.25, 0.5)
#
# Theoretical max: 2×2×2×2×3×2×2×2×2×2×2×2 = 3072
# After redundancy filtering: ~700 unique configs
#
# === USAGE ===
#   cd src/norm_3
#   pixi run python -m norm_3.pipeline --multirun \
#     +sweep=embeddings_gpu \
#     input.path=/path/to/embeddings.parquet

defaults:
  - /preset/gpu_base

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES ===
# Must match FIRST value in each sweep list for redundancy detection
batch_method: none
norm_method: robustmad
norm_fit_controls: true

use_spherize: false
spherize_fit_controls: true
spherize_method: "ZCA-cor"
spherize_epsilon: 1.0e-06

use_pca: false
pca_n_components: 64

use_prune_correlated: false
corr_thresh: 0.90

agg_method: median

# TVN params (when batch_method=tvn)
tvn_alpha: 0.5
tvn_epsilon: 1.0
tvn_fit_controls: true

# TVN_EFAAR params (when batch_method=tvn_efaar)
tvn_efaar_epsilon: 0.25

# === FIXED PARAMETERS ===
use_filter_features: false
skip_visualization: true

# === HYDRA SWEEP ===
hydra:
  sweeper:
    params:
      # Batch correction method
      batch_method: none,tvn_efaar

      # Standard normalization method
      norm_method: robustmad,standardize

      # Fit normalization on controls only vs all samples
      norm_fit_controls: true,false

      # PCA dimensionality reduction
      use_pca: false,true
      pca_n_components: 64,128,256

      # Spherize whitening
      use_spherize: false,true
      spherize_method: ZCA-cor,PCA-cor
      spherize_fit_controls: true,false

      # Feature pruning (remove highly correlated features)
      use_prune_correlated: false,true
      corr_thresh: 0.90,0.95

      # TVN_EFAAR regularization (lower = more aggressive correction)
      tvn_efaar_epsilon: 0.25,0.5

      # Aggregation method
      agg_method: median,mean

  # GPU: use limited parallelism (2 jobs to avoid memory issues)
  launcher:
    n_jobs: 2
    prefer: processes
    verbose: 1
