# Test config: Full pipeline (RobustMAD + PCA + Spherize)

input:
  path: "/home/jfredinh/projects/JUMP_core/output/dinov2_random_jump_target2_4plate_zstd_raw_features.parquet"

output:
  path: "data/features/norm3_test/output.parquet"
  compression: zstd

abort_on_invalid_features: true
max_pc1_variance: 0.50
abort_on_ill_conditioned_tvn: true

steps:
  - name: clean_nans
    enabled: true
    params:
      na_cutoff: 0.30

  - name: normalize_robustmad
    enabled: true
    params:
      batch_col: Metadata_Plate
      fit_on_controls: false
      epsilon: 1.0e-18

  - name: normalize_pca
    enabled: true
    params:
      n_components: 128
      whiten: false
      fit_on_controls: false

  - name: normalize_spherize
    enabled: true
    params:
      method: ZCA-cor
      batch_col: ""
      fit_on_controls: false
      epsilon: 1.0e-6

  - name: aggregate_wells
    enabled: true
    params:
      strata:
        - Metadata_Plate
        - Metadata_Well
      method: median

  - name: evaluate_metrics
    enabled: false
    params:
      skip_visualization: true
