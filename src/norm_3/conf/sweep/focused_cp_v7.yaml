# @package _global_

# Focused CellProfiler Sweep v7
#
# Identical to v6 except output path → variance_first_v7/
#
# Based on v5 findings:
#   - TVN EFAAR wins 93% of CP models -> fix batch_method=tvn_efaar
#   - PCA almost never helps CP -> fix use_pca=false
#   - norm_method is 60/40 -> keep sweeping
#   - tvn_epsilon was only tested at 0.5 -> explore range
#   - outlier_cutoff and prune_thresh never varied -> explore now
#
# Sweep grid:
#   2 norm x 3 outlier x 3 prune x 3 tvn_eps = 54 configs per dataset
#   15 CP datasets x 54 = 810 runs

defaults:
  - /preset/gpu_base_variance_first

output:
  path: "data/features/variance_first_v7/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES (swept params need top-level keys for Hydra struct) ===
batch_method: tvn_efaar
norm_method: robustmad
use_wellcorr: false
use_int: true
use_sample_norm: false
use_pca: false

# Swept parameters (defaults — overridden by hydra.sweeper.params)
outlier_cutoff: 100
corr_thresh: 0.9
tvn_efaar_epsilon: 0.5

agg_method: median

# Fixed params (not swept)
tvn_original_k: 64
tvn_cascade_k1: 128
tvn_cascade_k2: 32
spherize_epsilon: 1.0e-6
spherize_fit_controls: false

# === FIXED PARAMETERS ===
skip_visualization: true

# === HYDRA SWEEP ===
# 2 norm x 3 outlier x 3 prune x 3 tvn_eps = 54 configs per dataset
hydra:
  sweeper:
    params:
      norm_method: robustmad,standardize
      outlier_cutoff: 50,100,500
      corr_thresh: 0.8,0.9,0.95
      tvn_efaar_epsilon: 0.1,0.5,1.0

  launcher:
    n_jobs: 8
    prefer: processes
    verbose: 1
