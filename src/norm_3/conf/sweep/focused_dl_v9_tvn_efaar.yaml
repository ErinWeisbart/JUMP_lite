# @package _global_

# Focused Deep Learning Embeddings Sweep v9 — batch_method=tvn_efaar
#
# Changes from v8: no outlier removal, no correlation pruning.
# DL embeddings don't need hand-crafted feature filters.
#
# Sweep grid: 2 norm x 2 fit_ctrl x 3 eps x 8 n_comp = 96 configs per dataset
# No INT: DL embeddings don't benefit from rank-based transforms
# use_pca fixed to false: PCA dramatically hurts tvn_efaar (balance 490 vs 79)

defaults:
  - /preset/gpu_base_variance_first_v9

output:
  path: "data/features/variance_first_v9/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES ===
batch_method: tvn_efaar
norm_method: robustmad
norm_fit_controls: true
use_wellcorr: false
use_int: false
use_sample_norm: false
use_pca: false

# Swept parameters (defaults — overridden by hydra.sweeper.params)
tvn_efaar_epsilon: 0.5
tvn_efaar_n_components: 128

# Canonical defaults for non-swept method params (per is_redundant_config)
tvn_original_k: 64

agg_method: median

# Fixed params (not swept)
tvn_cascade_k1: 128
tvn_cascade_k2: 32
spherize_epsilon: 0.1
spherize_fit_controls: false
spherize_remove_variance_threshold: null
spherize_remove_variance_method: threshold

# Dim/control ratio guard
dim_ratio_threshold: 2.5
dim_ratio_action: clamp

# === FIXED PARAMETERS ===
skip_visualization: true

# === HYDRA SWEEP ===
# 2 x 2 x 3 x 8 = 96 configs per dataset (use_pca fixed, no INT)
hydra:
  sweeper:
    params:
      norm_method: robustmad,standardize
      norm_fit_controls: true,false
      tvn_efaar_epsilon: 0.05,0.1,0.2
      tvn_efaar_n_components: 64,96,128,196,256,318,384,512

  launcher:
    n_jobs: 32
    prefer: processes
    verbose: 1
