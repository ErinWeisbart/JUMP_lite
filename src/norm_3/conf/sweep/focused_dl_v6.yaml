# @package _global_

# Focused Deep Learning Embeddings Sweep v6
#
# Based on v5 findings:
#   - TVN EFAAR wins 80% of DL models, TVN Original wins top score (morphem_mq)
#   - PCA almost never helps → fix use_pca=false
#   - norm_method is 54/46 → keep sweeping
#   - tvn_epsilon was only tested at 0.5 → explore range
#   - tvn_original_k was only tested at 64 → explore range
#   - outlier_cutoff and prune_thresh not worth sweeping for embeddings
#
# Pipeline order:
#   1. NaN removal
#   2. Low variance filtering (variance_threshold)
#   3. Normalization (RobustMAD or Standardize)
#   4. Outlier removal (fixed cutoff=100)
#   5. Inverse Normal Transform
#   6. Correlation pruning (fixed threshold=0.9)
#   7. Batch correction: TVN EFAAR or TVN Original (params swept)
#
# Sweep grid (before redundancy filtering):
#   2 norm × 2 batch × 3 tvn_eps × 3 tvn_k = 36
#   After redundancy filtering (tvn_eps ignored when tvn_original, tvn_k ignored when tvn_efaar):
#     tvn_efaar:    2 norm × 3 eps = 6
#     tvn_original: 2 norm × 3 k   = 6
#     Total: 12 configs per dataset
#   35 DL datasets × 12 = 420 runs

defaults:
  - /preset/gpu_base_variance_first

output:
  path: "data/features/variance_first_v6/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES (swept params need top-level keys for Hydra struct) ===
batch_method: tvn_efaar
norm_method: robustmad
use_wellcorr: false
use_int: true
use_sample_norm: false
use_pca: false

# Fixed feature selection params
corr_thresh: 0.9
outlier_cutoff: 100

# Swept parameters (defaults — overridden by hydra.sweeper.params)
tvn_efaar_epsilon: 0.5
tvn_original_k: 64

agg_method: median

# Fixed params (not swept)
tvn_cascade_k1: 128
tvn_cascade_k2: 32
spherize_epsilon: 1.0e-6
spherize_fit_controls: false

# === FIXED PARAMETERS ===
skip_visualization: true

# === HYDRA SWEEP ===
# After redundancy filtering: 12 configs per dataset
hydra:
  sweeper:
    params:
      norm_method: robustmad,standardize
      batch_method: tvn_efaar,tvn_original
      tvn_efaar_epsilon: 0.1,0.5,1.0
      tvn_original_k: 32,64,128

  launcher:
    n_jobs: 8
    prefer: processes
    verbose: 1
