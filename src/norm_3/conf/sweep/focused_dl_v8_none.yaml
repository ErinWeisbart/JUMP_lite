# @package _global_

# Focused Deep Learning Embeddings Sweep v8 — batch_method=none
#
# Split from v6 to eliminate Cartesian product overhead.
# Only sweeps pipeline toggles; no batch correction method params.
#
# Sweep grid: 2 norm x 2 fit_ctrl x 2 int = 8 configs per dataset

defaults:
  - /preset/gpu_base_variance_first_v8

output:
  path: "data/features/variance_first_v8/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES ===
batch_method: none
norm_method: robustmad
norm_fit_controls: true
use_wellcorr: false
use_int: true
use_sample_norm: false
use_pca: false

# Fixed feature selection params
corr_thresh: 0.9
outlier_cutoff: 100

# Canonical defaults for non-swept method params (per is_redundant_config)
tvn_efaar_epsilon: 0.5
tvn_efaar_n_components: 128
tvn_original_k: 64

agg_method: median

# Fixed params (not swept)
tvn_cascade_k1: 128
tvn_cascade_k2: 32
spherize_epsilon: 0.1
spherize_fit_controls: false

# Dim/control ratio guard
dim_ratio_threshold: 2.5
dim_ratio_action: clamp

# === FIXED PARAMETERS ===
skip_visualization: true

# === HYDRA SWEEP ===
# 2 x 2 x 2 = 8 configs per dataset
hydra:
  sweeper:
    params:
      norm_method: robustmad,standardize
      norm_fit_controls: true,false
      use_int: true,false

  launcher:
    n_jobs: 32
    prefer: processes
    verbose: 1
