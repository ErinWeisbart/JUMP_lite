# @package _global_

# Spherize-Only Sweep to Complete the Variance-First Pipeline
# This runs ONLY the spherize batch correction configs that were filtered out

defaults:
  - /preset/gpu_base_variance_first

# Override output to same folder as v3_optimized
output:
  path: "data/features/variance_first_v3_optimized/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true  # Skip already completed configs
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES ===
batch_method: spherize  # ONLY spherize
norm_method: robustmad

use_wellcorr: false
use_int: true
use_sample_norm: false
use_spherize: false
use_pca: false

# Feature selection is ALWAYS enabled with FIXED parameters
corr_thresh: 0.9
outlier_cutoff: 15

agg_method: median

# === FIXED PARAMETERS ===
skip_visualization: true

# === HYDRA SWEEP ===
# 2 normalization methods × 1 batch correction (spherize) = 2 configs per dataset
hydra:
  sweeper:
    params:
      # Normalization method: RobustMAD vs Standardize
      norm_method: robustmad,standardize

      # Batch correction: ONLY spherize
      batch_method: spherize

  launcher:
    n_jobs: 16
    prefer: processes
    verbose: 1
