# @package _global_

# Optimized CellProfiler Sweep for norm_3
#
# Based on best settings from comprehensive_optimal_extra:
# - Best PA (82%): wellcorr + INT + prune_0.85 + tvn_efaar + PCA-cor
# - Best PC (24%): robustmad + wellcorr + INT + prune_0.85 + ZCA-cor_ctrl
#
# Sweep explores the key parameters that affect PA/PC tradeoff.
#
# ~24 configs total
#
# === USAGE ===
#   cd src/norm_3
#   pixi run python -m norm_3.pipeline --multirun \
#     +sweep=optimized_cellprofiler \
#     input.path=/path/to/cellprofiler.parquet

defaults:
  - /preset/gpu_base

# Override output to separate folder
output:
  path: "data/features/optimized_cellprofiler_sweep/output.parquet"
  compression: zstd

input_override: null

# === VALIDATION SETTINGS ===
skip_redundant_configs: true
skip_existing: true
abort_on_invalid_features: true
abort_on_ill_conditioned_tvn: true
max_pc1_variance: 0.70

# === DEFAULT VALUES ===
batch_method: tvn_efaar
norm_method: robustmad
norm_fit_controls: false

use_wellcorr: true
use_int: true
use_sample_norm: false
sample_norm_type: l2

use_spherize: true
spherize_fit_controls: true
spherize_method: "PCA-cor"

use_pca: false
pca_n_components: 64

use_filter_features: true
use_prune_correlated: true
corr_thresh: 0.85

agg_method: mean

tvn_efaar_epsilon: 0.5

# === FIXED PARAMETERS ===
skip_visualization: true

# === HYDRA SWEEP ===
# With spherize: 2 x 2 x 2 x 3 = 24 configs
# Without spherize: 2 x 3 = 6 configs (redundant spherize params skipped)
# Total unique: 30 configs
hydra:
  sweeper:
    params:
      # Batch correction: tvn_efaar (best) vs none
      batch_method: tvn_efaar,none

      # Spherize: on vs off
      use_spherize: true,false

      # Spherize method: PCA-cor vs ZCA-cor
      spherize_method: PCA-cor,ZCA-cor

      # Spherize fit on controls: true (better PC) vs false
      spherize_fit_controls: true,false

      # Prune threshold: 0.85 (best) vs 0.90 vs 0.95
      corr_thresh: 0.85,0.90,0.95

  launcher:
    n_jobs: 4
    prefer: processes
    verbose: 1
